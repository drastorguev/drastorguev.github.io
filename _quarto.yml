project:
  type: website
  render:
    - "*.qmd"
    - "!posts/"
  resources:
    - CNAME
    - .nojekyll

website:
  title: "Dmitry Rastorguev"
  search: false
  navbar:
    background: primary
    right:
      - text: "Home"
        file: index.qmd
      - text: "Projects"
        file: projects.qmd
      - text: "About"
        file: about.qmd
      # - text: "Blog"
      #   file: blog.qmd
      - text: "Contact"
        file: contact.qmd
      - icon: linkedin
        href: https://www.linkedin.com/in/dmitryrastorguev/
  page-footer:
    left: "Copyright 2026, Dmitry Rastorguev"
  # google-analytics: "G-KGHL346XM6"
  cookie-consent:
    palette: dark
    type: express
  site-url: "https://rastorguev.co.uk/"
  twitter-card:
    card-style: summary_large_image
    creator: "@dsrastorguev"
    image: "/static/website_image.jpg"
  open-graph:
    locale: en_GB
    image: "/static/website_image.jpg"


format:
  html:
    theme: cosmo
    css: styles.css
