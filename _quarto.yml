lang: en-GB

project:
  type: website
  pre-render: node projects_utils/build_projects.js
  render:
    - "*.qmd"
    - "projects/*.qmd"
    - "!posts/"

  resources:
    - CNAME
    - .nojekyll

website:
  title: "Dmitry Rastorguev"
  description: "Quantitative analyst and data scientist in London applying data science to financial risk, capital markets and fintech."
  search: false
  navbar:
    background: primary
    left:
      - text: "Home"
        file: index.qmd
      - text: "Projects"
        file: projects.qmd
      - text: "About"
        file: about.qmd
      - text: "Contact"
        file: contact.qmd
    right:
      - text: "Connect on <i class='bi bi-linkedin' role='img'></i>"
        href: https://www.linkedin.com/in/dmitryrastorguev/
  sidebar:
    # BEGIN generated: projects-sidebar
    - id: projects-sidebar
      title: "Projects"
      style: docked
      background: light
      contents:
        - text: "Overview"
          file: projects.qmd
        - section: "Banking"
          contents:
            - text: "Global Investment Bank - Economic Capital Models Migrations"
              file: projects/investment-bank-economic-capital-models-migration.qmd
            - text: "Global Investment Bank - Corporate Borrower Stress Testing"
              file: projects/investment-bank-corporate-borrower-cash-flow-stress-testing.qmd
            - text: "Challenger Bank - Lending Product P&L and Return on Equity"
              file: projects/challenger-bank-lending-products-roe-calculator.qmd
            - text: "Challenger Bank - Hedge Accounting and General Ledger ETL"
              file: projects/challenger-bank-hedge-accounting-general-ledger-etl.qmd
        - section: "Fintech"
          contents:
            - text: "BNPL Lender - Credit Strategy and Customer Segmentation"
              file: projects/bnpl-lender-credit-strategy-customer-segmentation.qmd
            - text: "Cross-border Money Transfers - User Activity Forecasting"
              file: projects/cross-border-money-transfers-user-activity.qmd
            - text: "Payments Platform - Merchant Churn and Payment Failure Analysis"
              file: projects/payments-platform-merchant-churn-payment-failures.qmd
        - section: "Sales & Trading"
          contents:
            - text: "Sales Desk AI Trade Recommendation Engine"
              file: projects/sales-desk-ai-trade-recommendation-engine.qmd
        - section: "Investment Management"
          contents:
            - text: "Large Asset Owner - Portfolio Manager Performance Analysis"
              file: projects/large-asset-owner-portfolio-manager-performance-analysis.qmd
            - text: "Short-only Hedge Fund - Adverse News Monitoring"
              file: projects/short-only-hedge-fund-adverse-news-monitoring.qmd
            - text: "Portfolio Stress Testing - Front-End Dashboard"
              file: projects/portfolio-stress-testing-analytics-frontend.qmd
        - section: "Private Markets"
          contents:
            - text: "ABF surveillance framework"
              file: projects/abf-surveillance-framework.qmd
            - text: "Insurance ABF data operations"
              file: projects/insurance-abf-data-operations.qmd
            - text: "AI VC Fund - Fundraising Statistics"
              file: projects/ai-vc-fund-fundraising-statistics.qmd
            - text: "Investment Data Platform - Databricks Migration and Reconciliation"
              file: projects/investment-data-platform-databricks-migration.qmd
            - text: "Investment Operations Applications - Python Tools, Document Parsing and AI"
              file: projects/investment-operations-python-applications-ai.qmd
            - text: "Secondaries Valuation - Fund Cash Flow and Exit Modelling"
              file: projects/private-capital-secondaries-valuation-cash-flow-model.qmd
    # END generated: projects-sidebar
  page-footer:
    left: "Copyright 2026, Dmitry Rastorguev"
  # google-analytics: "G-KGHL346XM6"
  cookie-consent:
    palette: dark
    type: express
  site-url: "https://rastorguev.co.uk/"
  twitter-card:
    card-style: summary_large_image
    creator: "@dsrastorguev"
    image: "/static/website_image.jpg"
  open-graph:
    locale: en_GB
    image: "/static/website_image.jpg"

format:
  html:
    theme: cosmo
    css: styles.css
    grid:
      sidebar-width: 320px
    include-in-header:
      - text: |
          <meta name="author" content="Dmitry Rastorguev">
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "Dmitry Rastorguev",
            "url": "https://rastorguev.co.uk/",
            "jobTitle": "Quantitative Analyst and Data Scientist",
            "description": "Quantitative analyst and data scientist applying data science to financial risk, capital markets and fintech.",
            "sameAs": ["https://www.linkedin.com/in/dmitryrastorguev/"],
            "homeLocation": {"@type": "Place", "name": "London, UK"},
            "knowsAbout": ["Quantitative finance", "Credit risk", "Financial data science", "Fixed income", "Monte Carlo simulation", "Python"]
          }
          </script>

execute:
  freeze: auto