    - title: Trust and auditability
      text: "Role-based access, secure handling of sensitive data, and an audit trail for every exception decision and scenario run."
    trade_off: "Journey-led delivery over a broad feature set. Fewer screens launch first, but each one is tested with users and built on shared components, so later journeys are faster and more consistent."
  implementation:
  - title: React and TypeScript application
    text: "React with TypeScript for the application shell and routing, with TanStack Query for server data and Zustand for interface state. Components are documented in Storybook, and ESLint, Prettier and strict TypeScript settings keep the codebase consistent."
  - title: Interactive charts and grids
    text: "AG Grid for high-volume position and exception tables, with server-side row models so large portfolios stay responsive. Highcharts or Plotly.js for risk and performance charts, and D3 where a custom visual is needed. Filters and drill-downs pass the same parameters to the API, so every view can be reproduced."
  - title: Python services and calculation APIs
