  category: Private Markets
  name: "Investment Data Platform - Databricks Migration, Pipelines and Reconciliation"
  meta_description: "Databricks migration and data pipelines for an investment platform: PySpark and SQL transformations, multi-source integration and reconciliation checks."
  keywords:
  - Databricks migration
  - Databricks data engineering
