  - Dmitry Rastorguev
  project_statement: "Once the data platform is in place, the private equity fund wants to put it to work. Investment and operations teams need applications that let business users analyse, input, update, upload and manage data, process documents without manual re-keying, and draw on the platform's data."
  requirements:
  - "Python applications that let business users analyse, input, update and upload data, and manage records."
  - "Document parsing and processing for internal workflows, with a person reviewing extracted data before it is saved."
  - "Applications that use data held in Databricks, with access controlled by the platform."
  - "Practical AI tools for internal workflows, built with AI-assisted development and full ownership of the code."
  - "Several deliverables run at once, each taken from requirements through testing to implementation."
  approach:
    intro: "I would start with the workflows that cost the most manual effort, and build each one as a small application that a business team can use and maintain."
    parts:
    - title: Business user tools first
      text: "Forms, uploads and editable data tables for the tasks analysts already perform, with validation before data is saved and a record of every change."
    - title: Document workflows with review
      text: "Documents are parsed, fields are extracted and checked against rules, then a reviewer confirms or corrects them before they reach the data platform."
    - title: AI where it saves time
      text: "AI extraction and summarisation are added only where they measurably reduce effort, always with human review and evaluation against a labelled test set."
    trade_off: "Human review over full automation for document processing. Reviewers stay in the loop at first, but errors are caught before they reach the data, and their corrections help improve the extraction over time."
  implementation:
  - title: Web application framework
    text: "FastAPI for backend APIs with Pydantic validation. Streamlit or Dash for business user interfaces where a full front end is not needed, and Django where an application needs a built-in admin and user management. Applications are tested with pytest and deployed as Databricks Apps or containers."
  - title: Data entry and editing
    text: "Editable tables built with the Streamlit data editor or AG Grid in a React front end, with pandas or Polars validating input before any write. Writes go to Delta tables through the Databricks SQL connector or Spark, and every change is recorded with user, time and previous value."
  - title: Document parsing
    text: "PyMuPDF and pdfplumber extract text and tables from PDFs, Unstructured handles mixed document formats, and pytesseract with Tesseract OCR reads scanned pages. Extracted fields are validated against Pydantic schemas and reviewed before they are saved."
  - title: AI-assisted extraction and analysis
    text: "LangChain or LlamaIndex orchestrate LLM calls for field extraction and summarisation. Hugging Face Transformers provide local classification models where documents must stay inside the platform. Outputs are evaluated with DeepEval or promptfoo against labelled examples before release."
  - title: Databricks integration
    text: "Applications read and write Delta tables through Spark and the Databricks SDK for Python, with Unity Catalog controlling which users see which data. MLflow tracks any model used in a workflow, so each output can be traced to a model version."
  - title: AI-assisted delivery and code ownership
    text: "AI coding tools speed up scaffolding and tests, with code review, pytest, Ruff and mypy checks on every change. Each application is documented well enough that the team can maintain it without the tools that helped build it."
  roadmap:
    phases:
    - phase: Requirements and priorities
      timing: Months 6–7
      deliverable: Ranked list of workflows, with owners and data sources
    - phase: First business tool
      timing: Months 7–8
      deliverable: Data entry or upload application in use with a business team
    - phase: Document workflow
      timing: Months 8–10
      deliverable: Document parsing and review application tested on real documents
    - phase: AI-assisted workflows
      timing: Months 10–11
      deliverable: AI extraction evaluated against labelled examples and released with review
    - phase: Handover
      timing: Month 12
      deliverable: Applications documented and handed over, with support for maintenance
  measures_of_success:
  - "Business users analyse, input, update and upload data in the applications without developer support."
  - "Document fields are extracted with a measured accuracy, and every value is reviewed before it is saved."
  - "Every application runs on the platform's access controls, and changes are recorded."
  - "The team can maintain each application without the AI tools used to build it."
- slug: private-capital-secondaries-valuation-cash-flow-model
  nav_title: "Secondaries Valuation - Fund Cash Flow and Exit Modelling"
  category: Private Markets
  name: "Private Equity Secondaries Valuation - Cash Flow, Exit and Fund Flow Modelling Capability"
  meta_description: "Python valuation model for private equity secondaries: fund cash flow projections, exit timing and fund flow dynamics to price LP stake sales."
  keywords:
  - private equity secondaries valuation
  - LP stake pricing model
  - secondary market fund modelling
  - private equity cash flow projection
  - exit timing modelling
  - fund flow dynamics analysis
  - Takahashi Alexander cash flow model
  - capital call and distribution forecasting
  - NAV roll-forward model
  - private markets liquidity analytics
  - Monte Carlo private equity exits
  - GP-led secondaries analytics
  - private capital Python modelling
  - secondary transaction pricing
  - Dmitry Rastorguev
  project_statement: "Support the build out of the platform that provides liquidity to LPs and GPs in private-markets secondaries needs a repeatable way to value fund interests. Pricing depends on how each fund's underlying cash flows are likely to arrive, through capital calls, distributions and exits. That modelling is often done case by case, which slows deals and makes results hard to reproduce."
  requirements:
  - "A valuation model for a private equity / credit fund interest, from its capital calls, distributions and NAV to a price for the stake."
  - "Projections of underlying exit cash flows under scenarios for exit timing, returns and fund life."
  - "Fund flow dynamics showing how calls, distributions and fees move cash through a fund over its life."
  - "Sparse or unreliable fund data handled explicitly, with stated assumptions and uncertainty ranges."
  - "Research prototypes turned into tested, production-grade components on the platform, with clear requirements for the engineering team."
  - "Reports that explain the drivers of each valuation to stakeholders."
  approach:
    intro: "I would build the model in layers, starting with transparent cash flow mechanics and then adding exit and scenario uncertainty, so each assumption can be checked before it affects a price."
    parts:
    - title: Cash flow mechanics
      text: "Capital calls, distributions, management fees and NAV are modelled fund by fund. A Takahashi-Alexander style framework is the baseline for how contributions and distributions unfold over the life of a fund."
    - title: Exit and scenario modelling
      text: "Exit timing and proceeds are simulated under base, slow and fast exit scenarios. Sparse fund histories are supported by peer benchmarks and explicit priors."
    - title: Valuation and reporting
      text: "The model converts projected cash flows into a price for the stake at a chosen discount rate, with IRR, multiple and sensitivity tables that the deal team can explain."
    trade_off: "Transparent cash flow mechanics over a single black-box price. Deal teams can see which assumptions drive the value and challenge them, at the cost of more manual assumption setting."
  implementation:
  - title: Cash flow engine
    text: "A typed Python library using pandas and Polars for fund cash flow schedules, with NumPy for vectorised projections. Capital calls, distributions, fees and NAV roll-forwards are tested with pytest and Hypothesis, so accounting identities hold across generated inputs."
  - title: Exit and scenario simulation
    text: "Monte Carlo simulation of exit timing and proceeds in NumPy. lifelines treats time to exit as a survival problem, and SciPy fits distributions for holding periods and multiples. Scenario sets are held as configuration files, so they can be changed without code edits."
  - title: Valuation and return metrics
    text: "IRR, PME and multiple calculations with numpy-financial and SciPy root-finding, plus discounting of projected cash flows at a chosen rate. Sensitivity grids show how the stake value moves with exit timing, NAV and discount rate."
  - title: Sparse data and Bayesian estimation
    text: "PyMC or NumPyro for hierarchical Bayesian estimates of fund-level parameters, pooling information across funds of similar vintage, strategy and size. Credible intervals are reported with every valuation, so uncertainty stays visible."
  - title: Data layer
    text: "DuckDB for querying fund, cash flow and NAV datasets locally, with SQL transformations that hold the shared definitions. Pandera validates data before modelling, and missing values are flagged rather than silently filled."
  - title: Platform integration and prototyping
    text: "Streamlit prototypes let the analyst team test assumptions quickly. Production code is packaged as a FastAPI service with Pydantic schemas, so the platform can call the model and the engineering team receives typed interface definitions and tests."
  - title: Reporting and deliverables
    text: "Excel outputs built with openpyxl or xlsxwriter for deal teams that work in spreadsheets, and written reports generated from Jinja2 templates, using the same numbers as the model."
  - title: Engineering workflow
    text: "Git for version control, Bash scripts for batch runs, and a command-line interface built with Typer for repeatable model runs. Code review and CI tests run on every change before release."
  roadmap:
    phases:
    - phase: Requirements and data review
      timing: Weeks 1–2
      deliverable: Agreed valuation scope, fund data sources and requirements for the engineering team
    - phase: Cash flow engine
      timing: Weeks 3–5
      deliverable: Tested fund cash flow and NAV roll-forward library
    - phase: Exit and valuation models
      timing: Weeks 6–9
      deliverable: Scenario simulation, return metrics and pricing sensitivity outputs
    - phase: Sparse data and uncertainty
      timing: Weeks 10–12
      deliverable: Hierarchical estimates with credible intervals, validated on historic fund data
    - phase: Platform integration and handover
      timing: Weeks 13–16
      deliverable: Service live on the platform, with documentation, reports and analyst training
  measures_of_success:
  - "Each valuation reconciles to the fund's reported cash flows and NAV within agreed tolerances."
  - "Every price comes with an uncertainty range and a sensitivity table the deal team can explain."
  - "Research prototypes move into production through documented requirements, with tests passing in CI."
  - "Analysts can run the model for a new fund without developer support."
