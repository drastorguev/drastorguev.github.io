  - title: Snowflake data access
    text: "Queries run from the service layer through snowflake-connector-python, Snowpark or snowflake-sqlalchemy, never from the browser. Queries are parameterised, paged and aggregated on the server, so users see only the rows their role allows."
  - title: Prototyping with Streamlit
