- slug: abf-surveillance-framework
  nav_title: ABF surveillance framework
  category: Private Markets
  name: 'Asset-Based Finance Surveillance: Framework, Data and Governance'
  meta_description: "Asset-based finance surveillance framework covering deal, collateral and servicer monitoring, automated data validation, watchlist controls and governance."
  keywords:
  - asset-based finance surveillance
  - structured credit monitoring
  - ABS deal surveillance
  - collateral performance monitoring
  - servicer data validation
  - trustee data reconciliation
  - watchlist governance
  - vintage cohort analysis
  - credit enhancement monitoring
  - Intex cashflow modelling
  - surveillance framework design
  - structured finance data automation
  - specialty finance monitoring
  - whole loan performance
  - Dmitry Rastorguev
  project_statement: 'An asset manager is growing its asset-based finance (ABF) platform across public and private strategies. The surveillance capability needs to keep pace: one consistent framework for monitoring transaction, collateral, counterparty and servicer performance, supported by scalable data, reporting and operating processes. The aim is to turn transaction-level performance into clear portfolio insight and recommended action for investment, valuation and governance teams.'
  requirements:
  - One surveillance framework across residential, consumer, commercial asset finance, specialty finance and whole-loan exposures, with consistent coverage, review standards and escalation.
  - Timely identification, investigation and escalation of deteriorating exposures, trigger and covenant breaches, servicing concerns and data exceptions.
  - A structured feedback loop from observed performance back to underwriting assumptions, structuring and documentation terms.
  - Data intake from trustees, servicers and administrators that is validated, reconciled and traceable.
  - Concise, evidence-based reporting for portfolio reviews, valuation discussions, watchlist meetings and investment committees.
  - A team that can run the function day to day, with clear accountabilities and quality controls.
  approach:
    intro: 'I would build the framework in the order the function depends on it: mandate, standards, data, then automation, with the team growing alongside.'
    parts:
    - title: Tiered coverage
      text: Exposures are grouped by size, risk and data quality. Each tier has a defined review frequency, depth of analysis and escalation path, so effort goes where the risk is.
    - title: Common core, asset-specific extensions
      text: Every deal is measured on a shared set of metrics, including delinquency, default, loss, recovery, prepayment, concentration, vintage performance and servicer trends. Less standardised assets, such as specialty finance, also get asset-specific indicators, so one template is not forced onto very different collateral.
    - title: Data before headcount
      text: Automating validation, reconciliation and calculations comes first. Scaling analysts on manual data work would add cost without adding coverage.
    trade_off: Consistency against flexibility. A strict template makes portfolio comparisons reliable but can miss unusual structures, so the core metrics stay fixed and the extensions vary by asset class, with each deviation documented.
  implementation:
  - title: Data pipelines
    text: "Python and SQL pipelines using pandas, Polars, DuckDB or dbt ingest trustee, servicer and administrator files. Pandera or Great Expectations apply validation rules, and reconciliation to trustee reports runs as automated tests with every break logged."
  - title: Calculations library
    text: "A version-controlled Python package with pytest tests for default and prepayment rates, loss severity, vintage curves and trigger tests. NumPy and pandas handle the arithmetic, numpy-financial supports cashflow and yield calculations, and outputs are cross-checked against Intex results where available."
  - title: Early-warning models
    text: "lifelines models prepayment and default hazard by vintage, statsmodels estimates how collateral performance responds to macro drivers, and scikit-learn classifiers flag watchlist deals earlier. SHAP explains each flag, so the surveillance team can see what triggered it."
  - title: Exception workflow
    text: "Case management built as a Django or FastAPI application on a SQL backend, with a Streamlit or Dash front end for work queues. Each case has a named owner, deadline and audit trail through to closure."
  - title: Reporting
    text: "Power BI dashboards for the surveillance team, connected to the governed SQL layer, and an automated watchlist and valuation pack generated with openpyxl and Jinja2 from the same data as the analysis."
  - title: Controls
    text: "Reviewer sign-off on watchlist changes, reconciliation checks before each reporting cycle, Great Expectations checkpoints on every load, change control on calculations through Git, and retained records for audit."
  roadmap:
    phases:
    - phase: Diagnostic and mandate
      timing: Month 1
      deliverable: Current-state review, coverage inventory, data availability by deal and stakeholder interviews
    - phase: Framework and standards
      timing: Months 2–3
      deliverable: Coverage tiers, review templates, watchlist and escalation protocols, committee calendar
    - phase: Data and automation
      timing: Months 3–6
      deliverable: Automated ingestion and validation, tested calculations, first dashboards
    - phase: Team and handover
      timing: Months 6–12
      deliverable: Team in place, first full committee cycle run from the automated pack, metrics reporting live
  measures_of_success:
  - Every exposure is reviewed at its tier's required frequency.
  - Trustee and servicer data is reconciled and on time before each reporting cycle.
  - Every exception is tracked to closure, with its owner and deadline recorded.
  - Underwriting and structuring feedback is documented each quarter.
  - Committee packs are produced from the automated pipeline, not rebuilt by hand.

- slug: insurance-abf-data-operations
  nav_title: Insurance ABF data operations
  category: Private Markets
  name: 'Insurance Asset-Based Finance Data Operations: Governance, Controls and Reporting'
  meta_description: "Insurance-focused asset-based finance data operations: automated ingestion, controls, reconciliation and NAIC and SSAP statutory reporting with handoffs."
  keywords:
  - insurance data governance
  - asset-based finance data operations
  - ABF data controls
  - insurance investment data SME
  - loan tape normalisation
  - servicer trustee reconciliation
  - NAIC designation data
  - SSAP 26R reporting data
