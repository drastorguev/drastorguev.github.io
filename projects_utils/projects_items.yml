  - title: Security and access control
    text: "OAuth2 and OpenID Connect sign-in through an identity provider, with Authlib in FastAPI. Role-based permissions are checked in API dependencies and on every query. Sensitive fields are masked in the browser, and access decisions are written to the audit log."
  - title: Automated testing and delivery
    text: "Jest and React Testing Library for components, Playwright for end-to-end journeys, and pytest with Hypothesis for the Python services and risk calculations. CI/CD runs every suite on each change, and code review is required before merge."
